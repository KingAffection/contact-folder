<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Contact Folder 📁 by Mr Affection❤️</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 28px 22px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 24px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #d7dbe3;
      border-radius: 10px;
      font-size: 16px;
      background: white;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #111827;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Contact Folder 📁</h1>

    <div class="subtitle">
      by Mr Affection❤️
    </div>

    <form id="contactForm">

      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter full name"
        required
      />

      <label for="country_code">Country Code</label>
      <select id="country_code" name="country_code" required>
        <option value="">Select country code</option>
        <option value="+1">🇺🇸 +1 USA / Canada</option>
        <option value="+509">🇭🇹 +509 Haiti</option>
        <option value="+33">🇫🇷 +33 France</option>
        <option value="+44">🇬🇧 +44 United Kingdom</option>
        <option value="+34">🇪🇸 +34 Spain</option>
        <option value="+49">🇩🇪 +49 Germany</option>
        <option value="+39">🇮🇹 +39 Italy</option>
        <option value="+32">🇧🇪 +32 Belgium</option>
        <option value="+41">🇨🇭 +41 Switzerland</option>
        <option value="+1">🇩🇴 +1 Dominican Republic</option>
        <option value="+52">🇲🇽 +52 Mexico</option>
        <option value="+55">🇧🇷 +55 Brazil</option>
      </select>

      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="Enter phone number"
        required
      />

      <label for="gender">Gender</label>
      <select id="gender" name="gender" required>
        <option value="">Select gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>

      <button type="submit" id="saveButton">
        💾 Save Contact
      </button>

      <div id="message"></div>

    </form>
  </div>

  <script>
    // ==============================
    // SUPABASE CONFIGURATION
    // ==============================

    const SUPABASE_URL =
      "https://mdjoxszvnoyiltntgsas.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_rsGDyxSF02tEyGOCOCzAIQ_FG5T6GBO";


    // ==============================
    // CREATE SUPABASE CLIENT
    // ==============================

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    // ==============================
    // FORM
    // ==============================

    const form =
      document.getElementById("contactForm");

    const button =
      document.getElementById("saveButton");

    const message =
      document.getElementById("message");


    // ==============================
    // SAVE CONTACT
    // ==============================

    form.addEventListener("submit", async function (event) {

      event.preventDefault();

      const name =
        document.getElementById("name").value.trim();

      const country_code =
        document.getElementById("country_code").value;

      const phone =
        document.getElementById("phone").value.trim();

      const gender =
        document.getElementById("gender").value;


      if (!name || !country_code || !phone || !gender) {

        message.style.color = "#dc2626";

        message.textContent =
          "Please complete all fields.";

        return;
      }


      button.disabled = true;

      button.textContent =
        "Saving...";

      message.textContent = "";


      try {

        const { data, error } =
          await supabaseClient

            .from("Contact 📁 Folder by Mr. Affection❤️")

            .insert([
              {
                name: name,
                country_code: country_code,
                phone: phone,
                gender: gender
              }
            ]);


        if (error) {

          console.error(
            "Supabase Error:",
            error
          );

          message.style.color =
            "#dc2626";

          message.textContent =
            "❌ Something went wrong. Please try again.";

          button.disabled = false;

          button.textContent =
            "💾 Save Contact";

          return;
        }


        message.style.color =
          "#16a34a";

        message.textContent =
          "✅ Contact saved successfully!";


        form.reset();

      } catch (error) {

        console.error(
          "Connection Error:",
          error
        );

        message.style.color =
          "#dc2626";

        message.textContent =
          "❌ Unable to connect to the server.";

      }


      button.disabled = false;

      button.textContent =
        "💾 Save Contact";

    });

  </script>

</body>
</html>
